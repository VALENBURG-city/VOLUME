<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВХОД В АККАУНТ</title>
    <link rel="stylesheet" href="/STYLEZZ/authSTYLE.css">
    <link rel="stylesheet" href="/INTERSTYLEZZ/STANDARTS.css">
    <link rel="stylesheet" href="/INTERSTYLEZZ/HEADER.css">
    <link rel="stylesheet" href="/INTERSTYLEZZ/FOOTER.css">
    <link rel="stylesheet" href="/INTERSTYLEZZ/CAPDOWNL.css">
</head>
<body>
    
    <a class="BACKBUTTON" href="STARTPAD.html">
        <img src="MEDIA/ON PAGES/arrow-up.svg" class="ARRBACK">
    </a>

    <section class="GLOBALSPATIUM">
        <h1 class="TITLE">С возвращением!</h1>
        <div class="AUTHcontainer">
            <p class="AUTHtabs">Вход в аккаунт</p>

        <form class="AUTHform" id="login-form">
            <div class="FORMgroup">
                <label class="FORMlabel" for="login-email">Электронная почта</label>
                <input class="FORMinput" type="email" id="login-email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="FORMgroup">
                <label class="FORMlabel" for="login-password">Пароль</label>
                <input class="FORMinput" type="password" id="login-password" name="password" placeholder="Введите пароль" required>
            </div>

            <div id="login-error" class="error-message"></div>

            <button type="submit" class="FORMsubmit">Войти</button>


            <div class="REGpole">
                <a>Ещё не создавали аккаунт? <a class="href" href="REGISTRATION.html">Зарегистрируйтесь здесь</a></a>
            </div>
        </form>
    </section>
    
    



  <div class="notification" id="notification"></div>

    <script src="SCRIPTORES/CAPDOWNL.js"></script>


<script src="SCRIPTORES/AUTH&REGscript.js"></script>

</body>
</html>
