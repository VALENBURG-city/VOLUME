    <link rel="stylesheet" href="/INTERSTYLEZZ/HEADER.css">
    

</head>
<body>
    
    <header>
        <section class="TOPpartHEADER">
            <a class="logotype">
                <img class="LOGO" src="/MEDIA/forHEADER/LOGO ver 1.png"> 
            </a>

            <div class="left">
                <button class="burger-toggle" id="burgerToggle" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <img class="AVATAR">
            </div>
        </section>

        <section class="LEFTpartHEADER" id="mainMenu">
            <nav class="BUTTONS">
                <ul>
                    <li><a href="PROFILE.html" class="NAVBUTT">ПРОФИЛЬ</a></li>
                    <li><a href="NEWREALIZE.html" class="NAVBUTT">НОВЫЙ РЕЛИЗ</a></li>
                    <li><a href="MY_MUSIC.html" class="NAVBUTT ActiveH">МОЯ МУЗЫКА</a></li>

    <button class="scroll" id="SCROLLTOP">
        <img src="MEDIA/ON PAGES/arrow-up.svg" class="arr">
    </button>

    
    <main class="ALT_GLOBALSPATIUM">

        
        <div class="PANEL" id="filterPanel">
            <button class="BUTTON_INTERNATIONAL filter-btn active" data-filter="released">ВЫПУЩЕННЫЕ</button>
            <button class="BUTTON_INTERNATIONAL filter-btn" data-filter="deleted">УДАЛЕННЫЕ</button>
            <button class="BUTTON_INTERNATIONAL filter-btn" data-filter="draft">ЧЕРНОВИКИ</button>
        </div>

        
        <section class="SPACE">
            <div class="FORMPOLE cut" id="searchContainer">
                <img class="searchIIMG" src="MEDIA/ON PAGES/Search.png">
                <input type="text" id="searchInput" placeholder="Поиск по названию...">
            </div>

            
            <div id="releasesContainer" >
                
            </div>
        </section>
        
    </main>


    <div class="notification" id="notification"></div>

    

    <script src="SCRIPTORES/RELEASES.js"></script>
    <script src="SCRIPTORES/PROFILE.js"></script>
    <script src="SCRIPTORES/SCROLLBUTT.js"></script>
